# A release, when a version tag (vX.Y.Z) is pushed: the package is built from that tag with its web app, the GitHub
# release is made with the notes git cliff generates, and the same files are published to PyPI as muninn-ai through
# Trusted Publishing: no token is kept anywhere, PyPI trusts this workflow (registered once on PyPI as the project's
# publisher, environment "pypi", which only a v* tag may deploy to). A tag already pushed is released with "Run
# workflow", using the workflow from that tag. The actions are pinned to commits: the job that publishes trusts them.
# Nothing runs while the repository is private: publishing to PyPI would make the code public.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # run from the tag ("Use workflow from": vX.Y.Z)

permissions:
  contents: read

jobs:
  build:
    name: package
    if: ${{ !github.event.repository.private && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          python-version: "3.13"
      - name: the tag is the package's version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$TAG" = "v$version" || { echo "the tag is $TAG but pyproject.toml says $version" >&2; exit 1; }
      - run: npm ci --no-audit --no-fund && npm run build
      - run: uv build -o dist
      - name: the package carries the web app
        run: unzip -l dist/*.whl | grep -q 'muninn/adapters/web/static/app.js'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff  # v4.9.1
        with:
          args: --current --strip header
        env:
          OUTPUT: notes.md
      - name: the release, or its files replaced when it was made by hand
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Muninn ${TAG#v}" --notes-file notes.md --verify-tag
          fi

  pypi:
    name: PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
